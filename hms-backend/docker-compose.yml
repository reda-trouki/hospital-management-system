services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hms
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: hms
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms -d hms"]
      interval: 5s
      retries: 10
  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/hms
      DB_USER: hms
      DB_PASSWORD: hms
      JWT_SECRET: change-this-to-a-long-random-secret-of-at-least-32-bytes
      CORS_ORIGINS: http://localhost:5173
      SEED_DEMO_DATA: "true"
    ports: ["8080:8080"]
volumes:
  pgdata:
