spring:
  application:
    name: hms-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hms}
    username: ${DB_USER:hms}
    password: ${DB_PASSWORD:hms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # schema is owned by Flyway (src/main/resources/db/migration)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-enums-using-to-string: true     # JSON uses labels such as "Lab Tech" / "In Progress"
    deserialization:
      read-enums-using-to-string: true
    mapper:
      accept-case-insensitive-enums: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # >= 32 bytes. Override with JWT_SECRET. The "prod" profile refuses to start without it.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration: 8h
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed-demo-data: ${SEED_DEMO_DATA:true}
